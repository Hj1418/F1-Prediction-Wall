<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 0 82 92" fill="none" className="grdx-flame-x-svg">
  <defs>
    <!-- Arm 1 Slanted Bar Gradient: Rich flame red to bright gold -->
    <linearGradient id="grdxFlameArm1Grad" x1="20%" y1="90%" x2="80%" y2="10%">
      <stop offset="0%" stop-color="#C91808" />
      <stop offset="25%" stop-color="#E6380A" />
      <stop offset="55%" stop-color="#FF6A00" />
      <stop offset="85%" stop-color="#FFAA00" />
      <stop offset="100%" stop-color="#FFD000" />
    </linearGradient>

    <!-- Arm 2 Silhouette Flame Gradient: Deep red base -> glowing orange body -> sharp flame tip -->
    <linearGradient id="grdxFlameBodyGrad" x1="22%" y1="88%" x2="92%" y2="4%">
      <stop offset="0%" stop-color="#C91808" />
      <stop offset="22%" stop-color="#E6380A" />
      <stop offset="48%" stop-color="#FF6A00" />
      <stop offset="72%" stop-color="#FFA600" />
      <stop offset="90%" stop-color="#FF5212" />
      <stop offset="100%" stop-color="#D41A08" />
    </linearGradient>

    <!-- Luminous Inner Core Gradient: Bright yellow-white incandescent flame spine -->
    <linearGradient id="grdxFlameCoreSpineGrad" x1="28%" y1="72%" x2="88%" y2="6%">
      <stop offset="0%" stop-color="#FFA600" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#FFF2A0" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="80%" stop-color="#FFD240" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0.7" />
    </linearGradient>

    <!-- White-Hot Core Intersection Radial Highlight -->
    <radialGradient id="grdxFlameHotCenter" cx="53%" cy="47%" r="32%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="32%" stop-color="#FFF4A0" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#FFA600" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF4A00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Arm 1: Top-Left to Bottom-Right (\) - crisp motorsport bar matching italic cap-height -->
  <path
    d="M33 10 L49 10 L85 88 L69 88 Z"
    fill="url(#grdxFlameArm1Grad)"
  />

  <!-- Arm 2: Bottom-Left to Top-Right (/) - Single unified silhouette extending subtly into flame tip -->
  <path
    d="M18 88 L34 88 
       L56 56 
       C63 45, 72 32, 80 20 
       C84 14, 87 8, 90 2 
       C88 8, 85 13, 82 17 
       C80 14, 79 10, 78 6 
       C75 12, 71 19, 67 26 
       C59 38, 51 51, 43 64 
       L18 88 Z"
    fill="url(#grdxFlameBodyGrad)"
  />

  <!-- Subtle Inner Flame Tongue for aerodynamic flame depth -->
  <path
    className="grdx-flame-tongue"
    d="M54 48 
       C60 38, 67 28, 77 18 
       C75 22, 73 27, 70 32 
       C65 39, 59 45, 54 48 Z"
    fill="url(#grdxFlameArm1Grad)"
    opacity="0.88"
  />

  <!-- Bright Yellow-White Incandescent Core Spine -->
  <path
    d="M40 62 
       L53 42 
       C57 35, 62 27, 69 19 
       C67 24, 65 29, 63 34 
       L47 62 Z"
    fill="url(#grdxFlameCoreSpineGrad)"
    opacity="0.9"
  />

  <!-- Incandescent Hot Center Glow at the intersection -->
  <ellipse cx="53" cy="47" rx="14" ry="12" fill="url(#grdxFlameHotCenter)" />
</svg>

